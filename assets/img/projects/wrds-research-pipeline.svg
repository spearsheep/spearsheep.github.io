<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Paper2WRDS financial research pipeline</title>
  <desc id="desc">
    Finance papers are parsed with multi-GPU MinerU, stored in Amazon S3, split into text, equation and visual chunks with source metadata, and
    indexed in Qdrant. Research questions drive planning, retrieval, source grounding, and Python or SQL draft generation with quotation and syntax
    checks. A versioned workspace supports researcher feedback and revision.
  </desc>
