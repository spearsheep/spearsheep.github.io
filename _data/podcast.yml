  description: A conversation about what AI changes in our work, our relationships, and the skills we choose to develop—from learning to code to the promise and limits of multi-agent systems.
questions:
  - number: "01"
    title: What is changing about work?
    text: Which tasks will AI take on, what new roles might emerge, and what should students spend their time learning?
  - number: "02"
    title: What should we believe?
    text: How do we separate real progress from hype, recognize uncertainty, and form judgments beyond a social media headline?
  - number: "03"
    title: What stays human?
    text: What happens to our relationships, curiosity, and independent thinking as AI becomes part of everyday life?
